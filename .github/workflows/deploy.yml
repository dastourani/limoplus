# What the real server runs. On every change to main: run backend tests (PostgreSQL), app checks (typecheck, unit
# tests, plot checks), and panel JS checks; only if ALL pass, build the web version and push to «deploy».
# A failed check leaves «deploy» as it was, so the server keeps running the last good version.
name: Deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: limoplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-only
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/limoplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps

  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:plots

  panel-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install backend and jsdom dependencies
        run: |
          pip install -r backend/requirements.txt
          npm --prefix app install --no-save jsdom
      - name: Prepare isolated sample database and run panel checks
        env:
          SECRET_KEY: panel-check
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py load_samples
          python manage.py shell -c "from apps.accounts.models import User; User.objects.filter(phone='09120000001').exists() or User.objects.create_superuser('09120000001', 'ci-pass')"
          cd ../app
          PYTHON=python3 node scripts/panel-check.js
          PYTHON=python3 node scripts/file-editor-check.js

  deploy:
    needs: [backend-tests, app-checks, panel-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the web version
        working-directory: app
        env:
          EXPO_PUBLIC_APP_CHANNEL: official
        run: |
          npm ci
          echo "EXPO_PUBLIC_API_URL=" > .env
          echo "EXPO_PUBLIC_APP_CHANNEL=official" >> .env
          echo "EXPO_PUBLIC_WEB_COMMIT=${GITHUB_SHA}" >> .env
          npx expo export -p web --output-dir dist

      - name: Put main + the web build on «deploy» (one commit, replaced each time)
        run: |
          rm -rf backend/webapp
          cp -r app/dist backend/webapp
          echo "${GITHUB_SHA}" > backend/webapp/build-commit.txt
          git checkout -q --orphan deploy
          git add -A
          git add -f backend/webapp
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
