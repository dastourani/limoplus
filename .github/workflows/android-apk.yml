# Builds a test APK on every change to the app and publishes it on the repository's Releases page.
# The owner downloads it from GitHub on the phone and installs it.
name: Android test APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Default server address for test builds
        # Can be changed later in the app (Settings). Set a repository variable EXPO_PUBLIC_API_URL to change the default.
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'http://192.168.1.100:8000' }}" > .env
          # The build number lets the server offer newer versions and turn away versions marked as too old.
          echo "EXPO_PUBLIC_APP_BUILD=${{ github.run_number }}" >> .env
          node -e "const f='app.json',j=require('./'+f);j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }};j.expo.version='1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: One APK per phone processor type
        # arm64: almost all phones of recent years. armeabi-v7a: phones running 32-bit Android (e.g. Galaxy A03).
        # Emulator types (x86) are skipped. Each APK is about a third of a universal one.
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "armeabi-v7a", "arm64-v8a"
                      universalApk false
                  }
              }
          }
          GRADLE

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "limookhan-test-${{ github.run_number }}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "limookhan-test-${{ github.run_number }}-32bit.apk"

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نسخه‌ی آزمایشی ${{ github.run_number }}"
          prerelease: true
          body: |
            نسخه‌ی آزمایشی اندروید (امضای آزمایشی؛ فقط برای تست).
            - `-arm64.apk`: بیشتر گوشی‌های چند سال اخیر.
            - `-32bit.apk`: گوشی‌هایی با اندروید ۳۲ بیتی، مثل Galaxy A03 و مدل‌های ارزان.
            اگر یکی نصب نشد، دیگری را امتحان کنید. بعد از نصب، از «تنظیمات سرور» آدرس سرور را وارد کنید.
          files: |
            app/limookhan-test-${{ github.run_number }}-arm64.apk
            app/limookhan-test-${{ github.run_number }}-32bit.apk
