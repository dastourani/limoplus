<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="sans-serif" font-size="12">
  <title>y = (x² − 1)/(x − 1) with a hole at (1, 2)</title>
  <rect width="320" height="240" fill="#ffffff"/>
  <g stroke="#c9d0c6" stroke-width="1">
    <line x1="40" y1="200" x2="300" y2="200"/>
    <line x1="80" y1="20" x2="80" y2="220"/>
  </g>
  <g fill="#56655b">
    <text x="296" y="216">x</text>
    <text x="86" y="28">y</text>
    <text x="72" y="214">0</text>
    <text x="134" y="214">1</text>
    <text x="64" y="104">2</text>
  </g>
  <line x1="74" y1="100" x2="80" y2="100" stroke="#56655b"/>
  <line x1="137" y1="200" x2="137" y2="206" stroke="#56655b"/>
  <line x1="40" y1="183" x2="300" y2="40" stroke="#3b44b8" stroke-width="3"/>
  <line x1="137" y1="100" x2="137" y2="200" stroke="#3b44b8" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="137" cy="100" r="6" fill="#ffffff" stroke="#3b44b8" stroke-width="2.5"/>
</svg>
