# Builds a test APK on every change to the app and publishes it on the repository's Releases page.
# The owner downloads it from GitHub on the phone and installs it.
name: Android test APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Default server address for test builds
        # Can be changed later in the app (Settings). Set a repository variable EXPO_PUBLIC_API_URL to change the default.
        run: echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'http://192.168.1.100:8000' }}" > .env

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "limoplus-test-${{ github.run_number }}.apk"

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نسخه‌ی آزمایشی ${{ github.run_number }}"
          prerelease: true
          body: |
            نسخه‌ی آزمایشی اندروید (امضای آزمایشی؛ فقط برای تست).
            بعد از نصب، از «تنظیمات سرور» آدرس سرور را وارد کنید.
          files: app/limoplus-test-${{ github.run_number }}.apk
