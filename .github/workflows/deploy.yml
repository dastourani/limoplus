# What the real server runs. On every change to main: run the backend tests, build the web version of the app, and
# put main + that build (backend/webapp) on the branch «deploy». ParsPack deploys from «deploy» (its webhook), so
# the server shows the web app at its root, talking to the server it came from (no second app, no CORS).
# A failed test or build leaves «deploy» as it was, so the server keeps running the last good version.
name: Deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        env:
          SECRET_KEY: test-only
          DEBUG: "True"
        run: |
          pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run
          python manage.py test apps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the web version
        working-directory: app
        run: |
          npm ci
          echo "EXPO_PUBLIC_API_URL=" > .env
          npx expo export -p web --output-dir dist

      - name: Put main + the web build on «deploy» (one commit, replaced each time)
        run: |
          rm -rf backend/webapp
          cp -r app/dist backend/webapp
          echo "${GITHUB_SHA}" > backend/webapp/build-commit.txt
          git checkout -q --orphan deploy
          git add -A
          git add -f backend/webapp
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
