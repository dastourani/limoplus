# اجرای کامل سرور روی سیستم خودتان:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: limoplus
      POSTGRES_USER: limoplus
      POSTGRES_PASSWORD: limoplus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limoplus"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
  media:
