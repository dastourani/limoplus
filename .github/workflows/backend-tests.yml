# Backend tests on PostgreSQL (the production database). Local runs use SQLite, which skips some checks
# (e.g. row locks); this catches what only PostgreSQL refuses.
name: Backend tests (PostgreSQL)

on:
  # Every push to a branch, then the pull request that follows it, ran the same tests twice: ~3 minutes each. Here a
  # new push to the same branch replaces the run still going (its answer is already old), and the pull request event
  # is left out because the push already answered for that commit.
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: limoplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-only
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/limoplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps
