# App checks (TypeScript, Vitest unit tests, and mathematical plot checks) on every change to app/.
name: App checks

on:
  push:
    paths: ["app/**", ".github/workflows/app-checks.yml"]
  workflow_dispatch:

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:plots
