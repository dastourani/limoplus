{% extends "admin/base_site.html" %}
{% block content %}
<div class="card" style="max-width: 520px; margin: 30px auto; padding: 28px; background: var(--body-bg, #fff); color: var(--body-fg, #111827); border-radius: 12px; border: 1px solid var(--hairline-color, #e5e7eb); box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
  <h2 style="margin-top:0; color: var(--body-fg, #111827); font-size: 20px; font-weight: 800;">{{ title }}</h2>
  <p style="color: var(--body-quiet-color, #4b5563); font-size: 13.5px; line-height: 1.7; margin-bottom: 20px;">
    ثبت و تأیید ایمیل کاری به شما امکان می‌دهد خروجی‌های TeX و آرشیو کامل کتاب را با یک کلیک مستقیماً روی ایمیل خود دریافت کنید.
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 18px;">
      <label for="id_email" style="display:block; font-weight:700; margin-bottom:6px; color: var(--body-fg);">آدرس ایمیل شما:</label>
      <input type="email" name="email" id="id_email" dir="ltr" required value="{{ user_email }}" placeholder="profs@university.ac.ir" style="width:100%; box-sizing:border-box; padding:10px 12px; background:var(--darkened-bg, #f9fafb); color:var(--body-fg, #111); border:1px solid var(--hairline-color, #d1d5db); border-radius:8px; font-size:14px;">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="button" style="background: #2563eb; color: #fff; padding: 10px 22px; border-radius: 8px; border: none; font-size:14px; font-weight: 700; cursor: pointer;">
        ذخیره و ارسال لینک تأیید
      </button>
      <a href="{% url 'admin:index' %}" class="button" style="background: var(--darkened-bg, #f3f4f6); color: var(--body-fg, #374151); border: 1px solid var(--hairline-color); padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size:14px; font-weight: 700;">
        انصراف
      </a>
    </div>
  </form>
</div>
{% endblock %}
